<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Great Team Derby — Tablet</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F3E63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Derby">
<link rel="apple-touch-icon" href="/icon.png?size=180">
<link rel="icon" href="/icon.png?size=64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  body { background: var(--cream); }
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--navy); color: var(--on-navy); padding: 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
  .topbar .name { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
  .topbar .metrics { margin-left: auto; display: flex; gap: 16px; }
  .topbar .metrics .k { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; opacity: .7; }
  .topbar .metrics .v { font-family: var(--font-num); font-weight: 700; font-size: 20px; }
  .app { max-width: 820px; margin: 0 auto; padding: 16px 16px 118px; }
  .big-center { min-height: 70vh; display: grid; place-items: center; text-align: center; }
  .big-center h1 { font-size: clamp(34px, 9vw, 64px); }
  /* Stor navy bund-navigation med ikoner (v2.7) */
  .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--navy); display: flex; overflow-x: auto;
    z-index: 10; box-shadow: 0 -6px 20px rgba(15,36,64,.25); padding-bottom: env(safe-area-inset-bottom, 0); }
  .navbar button { flex: 1 1 0; min-width: 96px; border: 0; background: none; padding: 10px 6px 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; border-top: 4px solid transparent;
    color: rgba(250,246,234,.62); font-weight: 700; font-size: 13px; transition: color .15s; }
  .navbar button .nico { font-size: 26px; line-height: 1.15; filter: grayscale(.5) brightness(1.05); transition: transform .15s, filter .15s; }
  .navbar button.active { color: #fff; border-top-color: var(--gold); background: rgba(250,246,234,.07); }
  .navbar button.active .nico { transform: translateY(-2px) scale(1.12); filter: none; }
  /* Niveau-progressbarer (hest/jockey) */
  .lvlbar { height: 7px; border-radius: 99px; background: var(--cream-3); overflow: hidden; margin-top: 4px; }
  .lvlbar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); }
  .lvlbar.maxed > i { background: linear-gradient(90deg, var(--turf), #4a7a63); }
  .lvlhint { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
  /* Flydende penge-delta i topbaren */
  .cash-float { position: absolute; right: 0; top: 100%; font-family: var(--font-num); font-weight: 800; font-size: 16px; pointer-events: none; white-space: nowrap; }
  .cash-float.plus { color: #7fd49a; } .cash-float.minus { color: #f0a3a3; }
  .topbar .metrics .center { position: relative; }
  /* Konfetti-burst ved store gevinster */
  .burst-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  .burst-wrap span { position: absolute; font-size: 26px; }
  .ex-tile { text-align: left; border: 2px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; cursor: pointer; }
  .ex-tile.owned { border-color: var(--gold); box-shadow: 0 0 0 3px #f6eec9; }
  .cat { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; }
  .cat.money { color: var(--gold); } .cat.jockey { color: var(--turf); } .cat.horse { color: var(--burgundy); }
  /* Kategorifarvede topkanter på kort og øvelses-fliser */
  .cat-top-money { border-top: 5px solid var(--gold) !important; }
  .cat-top-jockey { border-top: 5px solid var(--turf) !important; }
  .cat-top-horse { border-top: 5px solid var(--burgundy) !important; }
  /* Pre-season fanebjælke (spejler runde-navbaren, men inline og interaktiv) */
  .ps-tabs { display: flex; overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .ps-tabs button { flex: 1 0 auto; min-width: 92px; border: 0; background: none; padding: 12px 10px; font-weight: 700; color: var(--text-dim); font-size: 13px; cursor: pointer; border-bottom: 3px solid transparent; }
  .ps-tabs button.active { color: var(--navy); border-bottom-color: var(--gold); background: var(--cream); }
  /* Guld-accent under sektionsoverskrifter */
  .head-accent { width: 46px; height: 4px; border-radius: 99px; background: var(--gold); margin: 6px 0 4px; }
  .list-move { user-select: none; }
  .list-move .item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; margin-bottom: 8px; }
  .dice { font-family: var(--font-num); font-weight: 700; font-size: 64px; color: var(--navy); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/client.js"></script>
  <script src="/shared/kiosk.js"></script>
  <script src="/team/team.js"></script>
</body>
</html>
