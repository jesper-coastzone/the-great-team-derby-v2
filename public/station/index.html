<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tidslinje-stationen — The Great Team Derby</title>
<meta name="theme-color" content="#1F3E63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/icon.png?size=64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  body { background: var(--cream); }
  .app { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  .big-center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .station-head { text-align: center; padding: 18px 0 8px; }
  .station-head .eyebrow { letter-spacing: 3px; }
  .station-head h1 { font-size: clamp(30px, 7vw, 48px); }
  .owner-badge { display: flex; align-items: center; gap: 14px; justify-content: center; padding: 14px; border-radius: 14px; background: #fff; border: 2px solid var(--line); }
  .owner-dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; }
  .cardnum { font-family: var(--font-num); font-weight: 800; font-size: 30px; width: 64px; height: 64px; border-radius: 14px; border: 3px solid var(--navy); background: #fff; color: var(--navy); display: grid; place-items: center; cursor: pointer; }
  .cardnum.used { opacity: .25; pointer-events: none; }
  .slot { width: 56px; height: 56px; border-radius: 12px; border: 2px dashed var(--line); background: #fff; display: grid; place-items: center; font-family: var(--font-num); font-weight: 800; font-size: 24px; color: var(--navy); }
  .slot.filled { border-style: solid; border-color: var(--gold); background: #fdf6df; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/client.js"></script>
  <script src="/station/station.js"></script>
</body>
</html>
