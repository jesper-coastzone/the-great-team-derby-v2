<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Løbsleder — The Great Team Derby</title>
<meta name="theme-color" content="#032F4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/icon.png?size=64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  body { background: var(--cream); }
  .app { max-width: 720px; margin: 0 auto; padding: 16px 14px 40px; }
  .big-center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .rd-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 14px; }
  .rd-head h1 { font-size: clamp(22px, 5vw, 32px); }
  .st-btn { width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; font: inherit; }
  .st-btn b { font-size: 18px; color: var(--navy); display: block; }
  .st-btn span { font-size: 13px; color: #5b6b7d; }
  .team-row { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .team-dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; flex: 0 0 38px; }
  .team-info { flex: 1; min-width: 0; }
  .team-info b { display: block; color: var(--navy); }
  .team-info span { font-size: 12.5px; color: #5b6b7d; }
  .actions { display: flex; gap: 8px; }
  .actions .btn { padding: 10px 14px; }
  .cd { color: var(--burgundy); font-weight: 700; }
</style>
</head>
<body>
<div id="root" class="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared/client.js"></script>
<script src="loebsleder.js"></script>
</body>
</html>
